
name: Update gamevals

on:
  schedule:
    - cron: '0 12 * * 3' # Wednesday at 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gamevals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install requests==2.33.1

      - name: Find latest RuneLite GameVals commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result=$(gh search commits \
            --repo runelite/runelite \
            --sort committer-date \
            "Update GameVals to " \
            --json sha,commit \
            --jq '.[0] | {sha: .sha, message: .commit.message}')

          sha=$(echo "$result" | jq -r '.sha')
          rev=$(echo "$result" | jq -r \
            '.message | split("\n")[0] | ltrimstr("Update GameVals to ")')

          if [ -z "$sha" ] || [ "$sha" = "null" ]; then
            echo "No GameVals commit found"
            exit 1
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - name: Generate gamevals.json
        run: |
          python generate_gamevals.py "${{ steps.check.outputs.sha }}"

      - name: Commit updated gamevals.json
        run: |
          if git diff --no-index --quiet /dev/null gamevals.json 2>/dev/null; then
            echo "No gamevals.json generated"
            exit 1
          fi

          git add gamevals.json

          if git diff --cached --quiet; then
            echo "GameVals already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update gamevals to ${{ steps.check.outputs.rev }}"
          git push
